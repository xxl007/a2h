# Deploy the long-lived dev stage from main. workflow_dispatch is how the owner
# performs the very first dev deployment after docs/runbooks/aws-bootstrap.md.
# Spec: openspec/.../preview-environments/spec.md, "Merge to main", "Secrets inventory",
# "Merge to main verified", "Transient failure".
# Migrations before the deploy: openspec/changes/archive/2026-10-29-m1-protocol-connector/design.md
# D2 and Migration Plan (task 6.2).
#
# Role: vars.AWS_DEV_ROLE_ARN (gha-a2h-dev), trusted only for
# repo:xxl007/a2h:ref:refs/heads/main (contract amendment 1). Actions in the job
# holding id-token: write are pinned by commit SHA, tag in the comment.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-3
  STAGE: dev

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: deploy dev
    needs: check
    # Only main deploys dev (the role's trust policy says the same), and never a
    # run started by Dependabot.
    if: >-
      vars.A2H_DEPLOY_ENABLED == 'true' &&
      github.ref == 'refs/heads/main' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    # One dev deploy at a time, never cancelled (SST state lock).
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    outputs:
      web: ${{ steps.outputs.outputs.web }}
      mcp: ${{ steps.outputs.outputs.mcp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Configure AWS credentials (OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_DEV_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: a2h-deploy-dev

      # Migrations of schema public, the pgboss schema (design D3), then the
      # simulated set (design D2, Migration Plan step 2). The cluster comes
      # from the shared SSM parameters dev publishes. A failed migration fails
      # the job here, before any service rolls; migrations are forward-only
      # and additive, so the running services keep working on the new schema.
      - name: Migrate database (dev)
        id: migrate
        run: .github/scripts/db-migrate.sh "$STAGE"

      # One retry after a pause (transient AWS errors). No `sst unlock` before
      # it: a deploy that exits on its own releases the state lock; only a
      # killed process or a concurrent deploy keeps it (sst.dev/docs/reference/cli,
      # "unlock"), and the deploy-dev group rules out the second.
      # The step's result is the second attempt's.
      - name: Deploy stage dev
        id: deploy
        run: |
          if pnpm exec sst deploy --stage "$STAGE" --print-logs; then exit 0; fi
          echo "::warning::sst deploy of $STAGE failed; retrying once in 45 s."
          sleep 45
          pnpm exec sst deploy --stage "$STAGE" --print-logs

      - name: Read outputs
        id: outputs
        run: |
          test -f .sst/outputs.json || { echo "::error::.sst/outputs.json missing after deploy"; exit 1; }
          {
            echo "web=$(jq -er '.web' .sst/outputs.json)"
            echo "mcp=$(jq -er '.mcp' .sst/outputs.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "## dev deployed"
            echo
            echo "- commit: \`$GITHUB_SHA\`"
            if [ -f .sst/outputs.json ]; then
              echo "- web: $(jq -r '.web // "n/a"' .sst/outputs.json)"
              echo "- mcp: \`$(jq -r '.mcp // "n/a"' .sst/outputs.json)\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # dev proves itself after each deploy: sign-in through dev's mail sink (a
  # token for the suites), smoke (curl), MCP contract tests, the adversarial
  # suite's live half, web e2e and the web app's own flows against dev's URLs;
  # the workflow is red when any fails. The 61-minute idle-stream test stays
  # opt-in, by hand (tests/README.md). Under ten minutes (task 8.3), plus about
  # six for the file flows (m2-attachments 6.1): 25.
  verify:
    name: verify dev
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # One verify of dev at a time (run 41501855008 on a preview: overlapping
    # verifies share the stage's sign-ins, sink and registration limiter).
    concurrency:
      group: verify-dev
      cancel-in-progress: false
    permissions:
      # id-token: the stage's deploy role, for the stage's mail sink only
      # (m1-hosted-connector task 8.3). Nothing is deployed from here, and
      # dev's sign-in allow-list is never written from here.
      id-token: write
      contents: read
    env:
      STAGE: dev
      A2H_STAGE: dev
      # Synthetic QA principals (no mailbox exists; non-prod stages send nothing).
      # dev's allow-list (/a2h/shared/principal-allowlist) is the owner's and
      # read-only for CI: the owner puts these two addresses on it once
      # (runbook aws-bootstrap.md §15); without them the sign-in step fails
      # and the summary says so.
      A2H_TEST_EMAIL: qa-principal-a@a2h-protocol.org
      A2H_TEST_EMAIL_2: qa-principal-b@a2h-protocol.org
      # m2-attachments 6.1: the file suites run in their own step ("File flows"), not in the general
      # contract and adversarial steps.
      A2H_FILE_SUITES: own-step
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @a2h/tests exec playwright install --with-deps chromium

      # The live suites import @a2h/protocol, which resolves to its build
      # output (dist/); build it and the other workspace packages they import.
      - name: Build the packages the suites import
        run: pnpm --filter "@a2h/tests^..." build

      - name: Configure AWS credentials (OIDC; mail sink only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_DEV_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: a2h-verify-${{ env.STAGE }}

      # The uploads bucket holds the stage's mail sink under tmp/dev/mail/
      # (design D6).
      - name: Locate the stage's mail sink
        run: |
          bucket=$(aws ssm get-parameter --name /a2h/shared/uploads-bucket --query Parameter.Value --output text)
          echo "A2H_MAIL_SINK_BUCKET=$bucket" >> "$GITHUB_ENV"

      # Sign-in by magic link through the sink, consent, code, token (tests/lib/
      # obtain-token.ts): A2H_TOKEN and A2H_TOKEN_2 reach the suites through
      # GITHUB_ENV, masked. Needs the two QA addresses on the owner's dev list.
      - name: Sign in through the mail sink and obtain tokens
        id: tokens
        env:
          A2H_WEB_URL: ${{ needs.deploy.outputs.web }}
          A2H_MCP_URL: ${{ needs.deploy.outputs.mcp }}
        run: pnpm --filter @a2h/tests obtain-token

      - name: Smoke (dev health)
        id: smoke
        env:
          MCP_URL: ${{ needs.deploy.outputs.mcp }}
        run: |
          host="${MCP_URL#*://}"
          host="${host%%/*}"
          base="${MCP_URL%%://*}://$host"
          bash tests/ci/preview-smoke.sh "$base" dev

      - name: MCP contract tests
        id: contract
        env:
          A2H_MCP_URL: ${{ needs.deploy.outputs.mcp }}
        run: pnpm --filter @a2h/tests contract

      # Adversarial suite, live half (m1-protocol-connector task 7.2).
      - name: Adversarial suite
        id: adversarial
        env:
          A2H_MCP_URL: ${{ needs.deploy.outputs.mcp }}
        run: pnpm --filter @a2h/tests adversarial

      - name: Wait for the web URL
        id: web
        env:
          WEB_URL: ${{ needs.deploy.outputs.web }}
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS -o /dev/null --max-time 10 "$WEB_URL"; then exit 0; fi
            echo "web not answering yet (attempt $attempt of 20)"
            sleep 15
          done
          echo "::error::$WEB_URL did not answer 2xx within 5 minutes"
          exit 1

      - name: Web e2e
        id: e2e
        env:
          A2H_WEB_URL: ${{ needs.deploy.outputs.web }}
          A2H_MCP_URL: ${{ needs.deploy.outputs.mcp }}
        run: pnpm --filter @a2h/tests e2e

      # The sign-in, consent, client-registration and accessibility flows of
      # apps/web against this stage, through the sink (group 5, wired in 8.3).
      # m2-attachments: dev owns the uploads bucket (its POST CORS, S3 → EventBridge
      # and the malware scanner), so here the file tests of apps/web may not skip.
      - name: Web e2e (sign-in, consent, clients)
        id: web-e2e
        env:
          A2H_WEB_URL: ${{ needs.deploy.outputs.web }}
          A2H_MCP_URL: ${{ needs.deploy.outputs.mcp }}
          A2H_E2E_REQUIRE_FILE_STORAGE: "1"
          A2H_E2E_REQUIRE_FILE_CHECKS: "1"
        run: pnpm --filter @a2h/web e2e

      # m2-attachments 6.1, 6.2: files on real requests and the adversarial file
      # cases, storage and checks required (a skip fails), with the live EICAR
      # case against the real scanner (GuardDuty, dev's bucket only). Previews
      # get the same once dev has deployed this (preview.yml, "Files on this stage").
      - name: File flows (contract, adversarial, live EICAR)
        id: files
        env:
          A2H_MCP_URL: ${{ needs.deploy.outputs.mcp }}
          A2H_WEB_URL: ${{ needs.deploy.outputs.web }}
          A2H_FILE_STEP: "1"
          A2H_E2E_REQUIRE_FILE_STORAGE: "1"
          A2H_E2E_REQUIRE_FILE_CHECKS: "1"
        run: pnpm --filter @a2h/tests files

      # Adversarial case A8 (DCR flood) last: it fills the stage's registration
      # limiter for a minute from this runner's address, so it runs after every
      # step that registers a client (the web e2e; run 41436823855).
      - name: Adversarial DCR flood (case A8, last)
        id: dcr-flood
        env:
          A2H_MCP_URL: ${{ needs.deploy.outputs.mcp }}
          A2H_WEB_URL: ${{ needs.deploy.outputs.web }}
          A2H_DCR_FLOOD: "1"
        run: pnpm --filter @a2h/tests exec node --test --test-reporter=spec --test-name-pattern="case A8" adversarial/authorization.live.test.ts

      # No artifact (task 10.7, cold review of #51 B4): a Playwright trace, screenshot or report of
      # the sign-in and consent flows can hold a magic link, a session cookie or a code, and the
      # repository is public. The job log, with tokens masked, is the failure evidence.

      - name: Summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TOKENS: ${{ steps.tokens.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          CONTRACT: ${{ steps.contract.outcome }}
          ADVERSARIAL: ${{ steps.adversarial.outcome }}
          WEB: ${{ steps.web.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          WEB_E2E: ${{ steps.web-e2e.outcome }}
          FILES: ${{ steps.files.outcome }}
          DCR_FLOOD: ${{ steps.dcr-flood.outcome }}
          WEB_URL: ${{ needs.deploy.outputs.web }}
          MCP_URL: ${{ needs.deploy.outputs.mcp }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then result="passed"; else result="FAILED"; fi
          {
            echo "## dev verification: $result"
            echo
            echo "- commit: \`$GITHUB_SHA\`"
            echo "- web: $WEB_URL"
            echo "- mcp: \`$MCP_URL\`"
            echo
            echo "| Suite | Outcome |"
            echo "|---|---|"
            echo "| sign-in (tokens; the QA addresses must be on dev's allow-list, runbook §15) | ${TOKENS:-not run} |"
            echo "| smoke | ${SMOKE:-not run} |"
            echo "| contract | ${CONTRACT:-not run} |"
            echo "| adversarial | ${ADVERSARIAL:-not run} |"
            echo "| web reachable | ${WEB:-not run} |"
            echo "| e2e | ${E2E:-not run} |"
            echo "| web e2e | ${WEB_E2E:-not run} |"
            echo "| file flows (storage and checks required, live EICAR) | ${FILES:-not run} |"
            echo "| adversarial DCR flood (A8) | ${DCR_FLOOD:-not run} |"
          } >> "$GITHUB_STEP_SUMMARY"

  disabled:
    name: deploy not run
    needs: check
    if: >-
      vars.A2H_DEPLOY_ENABLED != 'true' ||
      github.ref != 'refs/heads/main' ||
      github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain
        env:
          EVENT: ${{ github.event_name }}
          ENABLED: ${{ vars.A2H_DEPLOY_ENABLED }}
          REF: ${{ github.ref }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "::notice::Runs started by Dependabot never deploy. A maintainer's push or merge to main deploys dev."
            exit 0
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::dev is deployed from main only; this run is on $REF. Use: gh workflow run deploy.yml --ref main"
            exit 1
          fi
          echo "::notice::Deploys are not enabled: repository variable A2H_DEPLOY_ENABLED is '$ENABLED', not 'true'. See docs/runbooks/aws-bootstrap.md."
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::error::Manual deploy requested but A2H_DEPLOY_ENABLED is not 'true'. Set AWS_DEV_ROLE_ARN, AWS_PREVIEW_ROLE_ARN and A2H_DEPLOY_ENABLED=true first."
            exit 1
          fi
