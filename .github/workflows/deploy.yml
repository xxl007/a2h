# Deploy the long-lived dev stage from main. workflow_dispatch is how the owner
# performs the very first dev deployment after docs/runbooks/aws-bootstrap.md.
# Spec: openspec/.../preview-environments/spec.md, "Merge to main", "Secrets inventory".
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  AWS_REGION: eu-west-3
  STAGE: dev

jobs:
  check:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: deploy dev
    needs: check
    # Only main deploys dev: the role trusts every ref of the repo, so a
    # workflow_dispatch from another branch must not reach the deploy.
    if: vars.A2H_DEPLOY_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    # One dev deploy at a time, never cancelled (SST state lock).
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v4

      - name: Configure AWS credentials (OIDC, no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: a2h-deploy-dev

      - name: Deploy stage dev
        run: pnpm exec sst deploy --stage "$STAGE" --print-logs

      - name: Summary
        run: |
          {
            echo "## dev deployed"
            echo
            echo "- commit: \`$GITHUB_SHA\`"
            if [ -f .sst/outputs.json ]; then
              echo "- web: $(jq -r '.web // "n/a"' .sst/outputs.json)"
              echo "- mcp: \`$(jq -r '.mcp // "n/a"' .sst/outputs.json)\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  disabled:
    name: deploy not run
    needs: check
    if: vars.A2H_DEPLOY_ENABLED != 'true' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Explain
        env:
          EVENT: ${{ github.event_name }}
          ENABLED: ${{ vars.A2H_DEPLOY_ENABLED }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::dev is deployed from main only; this run is on $REF. Use: gh workflow run deploy.yml --ref main"
            exit 1
          fi
          echo "::notice::Deploys are not enabled: repository variable A2H_DEPLOY_ENABLED is '$ENABLED', not 'true'. See docs/runbooks/aws-bootstrap.md."
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::error::Manual deploy requested but A2H_DEPLOY_ENABLED is not 'true'. Set AWS_DEPLOY_ROLE_ARN and A2H_DEPLOY_ENABLED=true first."
            exit 1
          fi
