# Preview environment per pull request: stage pr-<n>, schema and login pr_<n>.
# Spec: openspec/.../preview-environments/spec.md
#   "PR opened", "PR updated", "Two PRs open", "Typecheck fails", "Secrets inventory",
#   "Preview verified", "Verification outcome on the PR", "Transient failure".
# Migrations and seed before the deploy: openspec/changes/archive/2026-10-29-m1-protocol-connector/
#   design.md D2 and Migration Plan (task 6.2).
# Deploys only when the repository variable A2H_DEPLOY_ENABLED is 'true'
# (set by the owner after docs/runbooks/aws-bootstrap.md), only for
# same-repository PRs (forked PRs get no OIDC token and a read-only GITHUB_TOKEN),
# and never for Dependabot.
#
# Role: vars.AWS_PREVIEW_ROLE_ARN (gha-a2h-preview), trusted only for
# repo:xxl007/a2h:pull_request (contract amendment 1). Actions in the job holding
# id-token: write are pinned by commit SHA, tag in the comment.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

env:
  AWS_REGION: eu-west-3

jobs:
  check:
    # The CI gate, defined once in ci.yml. A red check means no deploy is attempted.
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  deploy:
    name: deploy pr-${{ github.event.pull_request.number }}
    needs: check
    if: >-
      vars.A2H_DEPLOY_ENABLED == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    # One deploy at a time per PR and never cancelled: SST holds a state lock,
    # and a cancelled deploy leaves the stage locked. teardown.yml shares the group.
    concurrency:
      group: preview-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    # 'true' when either state check found the PR not open, or could not read
    # it after its retries (the step fails, the run is red): the teardown job
    # below then runs the same sequence as teardown.yml, after re-reading the
    # state itself (require-closed), so an open PR is never torn down.
    outputs:
      closed: >-
        ${{ steps.open.outputs.open == 'false' || steps.state.outputs.open == 'false' ||
        steps.open.outcome == 'failure' || steps.state.outcome == 'failure' }}
      # 'true' only when this run deployed the stage of an open PR and read its
      # URLs: the verify job runs against them.
      deployed: >-
        ${{ steps.state.outputs.open == 'true' && steps.deploy.outcome == 'success' &&
        steps.outputs.outcome == 'success' }}
      web: ${{ steps.outputs.outputs.web }}
      mcp: ${{ steps.outputs.outputs.mcp }}
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      STAGE: pr-${{ github.event.pull_request.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      # No resurrection after close. The PR may have been closed while CI ran:
      # then nothing is created, not even the database login, and the teardown
      # job runs instead (its own teardown.yml run may have been cancelled).
      # Both state reads retry 5 times with backoff and fail the step if gh
      # never answers: an unreadable state is never taken as open or closed.
      - name: Check the PR is still open
        id: open
        run: |
          state=""
          for attempt in 1 2 3 4 5; do
            if out=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .state); then
              case "$out" in
                open | closed) state=$out; break ;;
                *) echo "::warning::PR #$PR_NUMBER: unexpected state '$out' (attempt $attempt of 5)" ;;
              esac
            else
              echo "::warning::Reading the state of PR #$PR_NUMBER failed (attempt $attempt of 5)"
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((2 ** attempt)); fi
          done
          if [ -z "$state" ]; then
            echo "::error::Could not read the state of PR #$PR_NUMBER after 5 attempts; failing instead of assuming it is open."
            exit 1
          fi
          echo "PR #$PR_NUMBER is $state"
          if [ "$state" = "open" ]; then echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$PR_NUMBER is $state: no preview is created; the teardown runs instead."
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.open.outputs.open == 'true'
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.open.outputs.open == 'true'

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: steps.open.outputs.open == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        if: steps.open.outputs.open == 'true'
        run: pnpm install --frozen-lockfile

      # SST builds the mcp and worker images for linux/arm64 with Docker.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
        if: steps.open.outputs.open == 'true'
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
        if: steps.open.outputs.open == 'true'

      - name: Configure AWS credentials (OIDC, no long-lived keys)
        if: steps.open.outputs.open == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: a2h-preview-pr-${{ github.event.pull_request.number }}

      # Secret a2h/pr-<n>/db, login role and schema pr_<n> (contract amendment 1).
      - name: Create database login and schema pr_${{ github.event.pull_request.number }}
        if: steps.open.outputs.open == 'true'
        run: .github/scripts/pr-schema.sh create "$PR_NUMBER"

      # Migrations of schema pr_<n>, as login pr_<n>, then the simulated set
      # (design D2, Migration Plan step 2). The cluster comes from the shared
      # SSM parameters, as for pr-schema.sh. A failed migration fails the job
      # here: nothing is deployed over a half-migrated schema (each file is
      # one transaction, rolled back on error). The log names the files
      # applied and the seed; migrations hold no question text and no secret.
      - name: Migrate database schema pr_${{ github.event.pull_request.number }}
        id: migrate
        if: steps.open.outputs.open == 'true'
        run: .github/scripts/db-migrate.sh "$STAGE"

      # Re-read immediately before the deploy: a deploy of a closed PR would
      # only be removed again. The login created above is dropped by the
      # teardown job below (not by the queued teardown.yml run, which a newer
      # deploy run may cancel while it is pending).
      - name: Re-read the PR state
        id: state
        if: steps.open.outputs.open == 'true'
        run: |
          state=""
          for attempt in 1 2 3 4 5; do
            if out=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq .state); then
              case "$out" in
                open | closed) state=$out; break ;;
                *) echo "::warning::PR #$PR_NUMBER: unexpected state '$out' (attempt $attempt of 5)" ;;
              esac
            else
              echo "::warning::Reading the state of PR #$PR_NUMBER failed (attempt $attempt of 5)"
            fi
            if [ "$attempt" -lt 5 ]; then sleep $((2 ** attempt)); fi
          done
          if [ -z "$state" ]; then
            echo "::error::Could not read the state of PR #$PR_NUMBER after 5 attempts; failing instead of assuming it is open."
            exit 1
          fi
          echo "PR #$PR_NUMBER is $state"
          if [ "$state" = "open" ]; then echo "open=true" >> "$GITHUB_OUTPUT"
          else
            echo "open=false" >> "$GITHUB_OUTPUT"
            echo "::notice::PR #$PR_NUMBER is $state: deploy skipped; the teardown runs instead."
          fi

      # One retry after a pause: M0's deploy failures were transient AWS errors
      # that passed unchanged on a rerun. No `sst unlock` before the retry: a
      # deploy that exits on its own releases the state lock; only a killed
      # process or a concurrent deploy keeps it (sst.dev/docs/reference/cli,
      # "unlock"), and the concurrency group above rules out the second.
      # The step's result is the second attempt's.
      - name: Deploy stage ${{ env.STAGE }}
        id: deploy
        if: steps.state.outputs.open == 'true'
        run: |
          if pnpm exec sst deploy --stage "$STAGE" --print-logs; then exit 0; fi
          echo "::warning::sst deploy of $STAGE failed; retrying once in 45 s."
          sleep 45
          pnpm exec sst deploy --stage "$STAGE" --print-logs

      - name: Read outputs
        id: outputs
        if: steps.state.outputs.open == 'true'
        run: |
          test -f .sst/outputs.json || { echo "::error::.sst/outputs.json missing after deploy"; exit 1; }
          {
            echo "stage=$(jq -er '.stage' .sst/outputs.json)"
            echo "web=$(jq -er '.web' .sst/outputs.json)"
            echo "mcp=$(jq -er '.mcp' .sst/outputs.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Write PR comment
        if: steps.state.outputs.open == 'true'
        env:
          OUT_STAGE: ${{ steps.outputs.outputs.stage }}
          OUT_WEB: ${{ steps.outputs.outputs.web }}
          OUT_MCP: ${{ steps.outputs.outputs.mcp }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "$OUT_WEB" in https://*) SIGN_IN="${OUT_WEB%/}/sign-in" ;; *) SIGN_IN="not deployed" ;; esac
          cat > "$RUNNER_TEMP/preview-comment.md" <<MD
          ## Preview \`$OUT_STAGE\`

          | | |
          |---|---|
          | Web | $OUT_WEB |
          | MCP endpoint (connector URL) | \`$OUT_MCP\` |
          | Sign in | $SIGN_IN |
          | Stage | \`$OUT_STAGE\` |
          | Commit | \`$HEAD_SHA\` |
          | Deploy run | $RUN_URL |

          Every call on the MCP endpoint needs a signed-in principal's token, \`ping\` and the tool list included; only the health path and the protected-resource metadata are open. Without a token the endpoint answers 401 with the challenge, which a hosted client (claude.ai) turns into sign-in. To see the challenge from your terminal:

          \`\`\`sh
          curl -si -X POST $OUT_MCP -H 'content-type: application/json' -H 'accept: application/json, text/event-stream' -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | grep -iE '^(HTTP|www-authenticate)'
          \`\`\`

          To sign in on this preview, add your address to its allow-list first (SecureString, nobody by default; runbook aws-bootstrap.md §15):

          \`\`\`sh
          aws ssm put-parameter --profile a2h-member --region eu-west-3 --name /a2h/$OUT_STAGE/principal-allowlist --type SecureString --overwrite --value 'you@example.com'
          \`\`\`

          Redeployed on every push to this PR; the URLs do not change. Removed when the PR is closed.
          MD

      - name: Comment on PR
        if: steps.state.outputs.open == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: a2h-preview
          path: ${{ runner.temp }}/preview-comment.md

      # A failed deploy must not leave a comment advertising URLs that now serve
      # an older commit (or nothing): replace it with the failure and the run link.
      # Not on a PR found closed at the start, whose comment belongs to the teardown.
      - name: Comment on PR (deploy failed)
        if: failure() && steps.open.outputs.open == 'true'
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: a2h-preview
          message: |
            ## Preview `pr-${{ github.event.pull_request.number }}` failed to deploy

            Commit `${{ github.event.pull_request.head.sha }}` did not deploy. Any URLs posted
            earlier may serve an older commit or nothing. Run log:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

  # The deployed preview proves itself: sign-in through the stage's mail sink
  # (a token for the suites), smoke (curl), MCP contract tests, the adversarial
  # suite's live half, web e2e and the web app's own flows against this run's
  # URLs; the PR check is red when any fails, and a Verification line is
  # appended to the preview comment either way. Measured on pr-59 (run
  # 41430407485): sign-in 29 s, contract 6 min 49 s (the request flows wait
  # for the simulated personas and a platform expiry), web e2e about 1.5 min;
  # the whole job is about 10.5 min, so the limit is 15 (task 8.3 asked for
  # ten; recorded in PR #59 for the PM).
  # Not in the preview-pr-<n> concurrency group: a pending verify must never
  # cancel a pending teardown. A group of its own instead: a verify adds the
  # QA principals to the stage's allow-list and removes them at the end, so
  # two verifies of one PR must not overlap (run 41501855008: the older one's
  # removal signed the newer one's principals out mid-run). A newer pending
  # verify replaces an older pending one; a running one is never cancelled.
  verify:
    name: verify pr-${{ github.event.pull_request.number }}
    needs: deploy
    if: needs.deploy.outputs.deployed == 'true'
    runs-on: ubuntu-latest
    # 30: the expiry flows run about 23 minutes in the background (m2-approval-page 6.1, 6.2).
    timeout-minutes: 30
    concurrency:
      group: preview-verify-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      # id-token: the stage's deploy role, for two things only: the sign-in
      # allow-list parameter and the stage's mail sink (m1-hosted-connector
      # task 8.3). Nothing is deployed from here.
      id-token: write
      contents: read
      pull-requests: write
    env:
      STAGE: pr-${{ github.event.pull_request.number }}
      A2H_STAGE: pr-${{ github.event.pull_request.number }}
      # Synthetic QA principals (no mailbox exists; non-prod stages send nothing):
      # admitted on the stage's allow-list for the run, removed at the end. Fresh
      # per run and attempt (m2-approval-page 6.1): a principal's monthly budget
      # is one value for every stage and the preview schema persists, so the
      # fifth verify run on pr-85 was refused with over_budget (run 42246226973).
      A2H_TEST_EMAIL: qa-principal-a-${{ github.run_id }}-${{ github.run_attempt }}@a2h-protocol.org
      A2H_TEST_EMAIL_2: qa-principal-b-${{ github.run_id }}-${{ github.run_attempt }}@a2h-protocol.org
      # m2-attachments 6.1: the file suites run in their own step ("File flows"), not in the general
      # contract and adversarial steps.
      A2H_FILE_SUITES: own-step
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @a2h/tests exec playwright install --with-deps chromium

      # The live suites import @a2h/protocol, which resolves to its build
      # output (dist/); build it and the other workspace packages they import.
      - name: Build the packages the suites import
        run: pnpm --filter "@a2h/tests^..." build

      - name: Configure AWS credentials (OIDC; allow-list and mail sink only)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: a2h-verify-${{ env.STAGE }}

      # Design D7 (group 8.3 fact): the stage's own SecureString; the two
      # synthetic addresses are added for this run and removed at the end,
      # other addresses untouched. The script prints counts, never an address.
      - name: Admit the QA principals on the stage's sign-in allow-list
        id: allowlist
        run: .github/scripts/allowlist.sh add "$STAGE" "$A2H_TEST_EMAIL,$A2H_TEST_EMAIL_2"

      # The uploads bucket (dev's, shared by previews) holds the stage's mail
      # sink under tmp/<stage>/mail/ (design D6).
      - name: Locate the stage's mail sink
        run: |
          bucket=$(aws ssm get-parameter --name /a2h/shared/uploads-bucket --query Parameter.Value --output text)
          echo "A2H_MAIL_SINK_BUCKET=$bucket" >> "$GITHUB_ENV"

      # m2-attachments 6.1: previews borrow dev's uploads bucket, and its POST
      # CORS, S3 → EventBridge and malware scanner come with dev's deploy from
      # main (infra/storage.ts); the preview deploys its own event rule and
      # queue. A CORS preflight for POST from this preview's origin says whether
      # that setup is there. Allowed: the file tests must run (a skip fails) in
      # every later step, the long flows included. Refused: they may skip, and
      # this step says so once. No answer from the bucket: the step fails.
      - name: Files on this stage (the bucket's CORS for this origin)
        id: files-probe
        env:
          WEB_URL: ${{ needs.deploy.outputs.web }}
        run: |
          origin=$(printf '%s' "$WEB_URL" | sed -E 's#^(https?://[^/]+).*#\1#')
          if .github/scripts/storage-cors.sh "$A2H_MAIL_SINK_BUCKET" "$origin"; then
            { echo "A2H_E2E_REQUIRE_FILE_STORAGE=1"; echo "A2H_E2E_REQUIRE_FILE_CHECKS=1"; } >> "$GITHUB_ENV"
          else
            rc=$?
            if [ "$rc" -ne 1 ]; then exit "$rc"; fi
            echo "::notice::File tests may skip on $STAGE: dev's uploads bucket does not allow POST from this origin yet (it will once dev deploys m2-attachments from main; from then on a skipped file test fails here)."
          fi

      # Sign-in by magic link through the sink, consent, code, token (tests/lib/
      # obtain-token.ts): A2H_TOKEN and A2H_TOKEN_2 reach the suites through
      # GITHUB_ENV, masked. The web app re-reads the allow-list within five
      # minutes (D7): the script asks for a link again every 30 s for up to
      # 5.5 minutes (tests/lib/obtain-token.ts signInUntilLink).
      - name: Sign in through the mail sink and obtain tokens
        id: tokens
        env:
          A2H_WEB_URL: ${{ needs.deploy.outputs.web }}
          A2H_MCP_URL: ${{ needs.deploy.outputs.mcp }}
        run: pnpm --filter @a2h/tests obtain-token

      # m2-approval-page 6.1, 6.2: an approval link lasts at least fifteen minutes
      # (design D2), so watching links and requests expire, and Send pressed after
      # a link expired (adversarial case 4), takes about 23 minutes. Started here in
      # the background with the tokens and sessions just obtained; collected by
      # "Expiry flows" before the allow-list is cleared. m2-attachments 6.1, 6.2
      # adds the file flows that take minutes (a file link and an upload policy
      # used after their 5 minutes, no scan result for 10 minutes, a request
      # with a file whose link expires: about 17 minutes, alongside).
      - name: Start the expiry flows (background, about 23 minutes)
        id: long-start
        env:
          A2H_MCP_URL: ${{ needs.deploy.outputs.mcp }}
          A2H_WEB_URL: ${{ needs.deploy.outputs.web }}
          A2H_LONG_FLOWS: "1"
        run: |
          cd tests
          ( node --test --test-reporter=spec contract/approval-expiry.test.ts adversarial/approval-expiry.live.test.ts contract/attachments-expiry.test.ts adversarial/attachments-expiry.live.test.ts > "$RUNNER_TEMP/expiry-flows.log" 2>&1; echo $? > "$RUNNER_TEMP/expiry-flows.exit" ) > /dev/null 2>&1 &
          echo "expiry flows started in the background"

      - name: Smoke (health, dev health, routing)
        id: smoke
        env:
          MCP_URL: ${{ needs.deploy.outputs.mcp }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          host="${MCP_URL#*://}"
          host="${host%%/*}"
          base="${MCP_URL%%://*}://$host"
          bash tests/ci/preview-smoke.sh "$base" "$PR_NUMBER"

      - name: MCP contract tests
        id: contract
        env:
          A2H_MCP_URL: ${{ needs.deploy.outputs.mcp }}
        run: pnpm --filter @a2h/tests contract

      # Adversarial suite, live half (task 7.2): manifest cases 1 to 6 and the
      # answers shown to the principal (cases 10, 11). Fail closed expected.
      - name: Adversarial suite
        id: adversarial
        env:
          A2H_MCP_URL: ${{ needs.deploy.outputs.mcp }}
        run: pnpm --filter @a2h/tests adversarial

      # CloudFront can take a moment to serve a first deploy: wait up to 5 min.
      - name: Wait for the web URL
        id: web
        env:
          WEB_URL: ${{ needs.deploy.outputs.web }}
        run: |
          for attempt in $(seq 1 20); do
            if curl -fsS -o /dev/null --max-time 10 "$WEB_URL"; then exit 0; fi
            echo "web not answering yet (attempt $attempt of 20)"
            sleep 15
          done
          echo "::error::$WEB_URL did not answer 2xx within 5 minutes"
          exit 1

      - name: Web e2e
        id: e2e
        env:
          A2H_WEB_URL: ${{ needs.deploy.outputs.web }}
          A2H_MCP_URL: ${{ needs.deploy.outputs.mcp }}
        run: pnpm --filter @a2h/tests e2e

      # The sign-in, consent, client-registration and accessibility flows of
      # apps/web against this stage, through the sink (group 5, wired in 8.3).
      - name: Web e2e (sign-in, consent, clients)
        id: web-e2e
        env:
          A2H_WEB_URL: ${{ needs.deploy.outputs.web }}
          A2H_MCP_URL: ${{ needs.deploy.outputs.mcp }}
        run: pnpm --filter @a2h/web e2e

      # m2-attachments 6.1, 6.2: files on real requests (contract) and the
      # adversarial file cases, with the requirements the probe step set (or
      # skips with its reason where the stage cannot store or check files yet).
      - name: File flows (contract and adversarial)
        id: files
        env:
          A2H_MCP_URL: ${{ needs.deploy.outputs.mcp }}
          A2H_WEB_URL: ${{ needs.deploy.outputs.web }}
          A2H_FILE_STEP: "1"
        run: pnpm --filter @a2h/tests files

      # Adversarial case A8 (DCR flood) last: it fills the stage's registration
      # limiter for a minute from this runner's address, so it runs after every
      # step that registers a client (the web e2e; run 41436823855).
      - name: Adversarial DCR flood (case A8, last)
        id: dcr-flood
        env:
          A2H_MCP_URL: ${{ needs.deploy.outputs.mcp }}
          A2H_WEB_URL: ${{ needs.deploy.outputs.web }}
          A2H_DCR_FLOOD: "1"
        run: pnpm --filter @a2h/tests exec node --test --test-reporter=spec --test-name-pattern="case A8" adversarial/authorization.live.test.ts

      # Waits for the background run (at most 25 minutes from here), prints its report, fails with it.
      - name: Expiry flows (link expiry, request expiry, Send after expiry)
        id: long
        if: ${{ !cancelled() && steps.long-start.outcome == 'success' }}
        run: |
          for _ in $(seq 1 150); do
            [ -f "$RUNNER_TEMP/expiry-flows.exit" ] && break
            sleep 10
          done
          cat "$RUNNER_TEMP/expiry-flows.log" 2>/dev/null || true
          if [ ! -f "$RUNNER_TEMP/expiry-flows.exit" ]; then
            echo "::error::the expiry flows did not finish in time"
            exit 1
          fi
          exit "$(cat "$RUNNER_TEMP/expiry-flows.exit")"

      - name: Remove the QA principals from the sign-in allow-list
        if: always() && steps.allowlist.outcome == 'success'
        run: .github/scripts/allowlist.sh remove "$STAGE" "$A2H_TEST_EMAIL,$A2H_TEST_EMAIL_2"

      # No artifact (task 10.7, cold review of #51 B4): a Playwright trace, screenshot or report of
      # the sign-in and consent flows can hold a magic link, a session cookie or a code, and the
      # repository is public. The job log, with tokens masked, is the failure evidence.

      - name: Write the Verification line
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          ALLOWLIST: ${{ steps.allowlist.outcome }}
          TOKENS: ${{ steps.tokens.outcome }}
          SMOKE: ${{ steps.smoke.outcome }}
          CONTRACT: ${{ steps.contract.outcome }}
          ADVERSARIAL: ${{ steps.adversarial.outcome }}
          WEB: ${{ steps.web.outcome }}
          E2E: ${{ steps.e2e.outcome }}
          WEB_E2E: ${{ steps.web-e2e.outcome }}
          FILES: ${{ steps.files.outcome }}
          DCR_FLOOD: ${{ steps.dcr-flood.outcome }}
          LONG: ${{ steps.long.outcome }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$JOB_STATUS" = "success" ]; then
            result="passed (sign-in, smoke, contract, adversarial, e2e, web e2e, file flows, DCR flood, expiry flows)"
          elif [ "$JOB_STATUS" = "cancelled" ]; then result="cancelled"
          elif [ "$ALLOWLIST" = "failure" ]; then result="FAILED (allow-list: the stage's parameter could not be set)"
          elif [ "$TOKENS" = "failure" ]; then result="FAILED (sign-in: no token obtained through the mail sink)"
          elif [ "$SMOKE" = "failure" ]; then result="FAILED (smoke)"
          elif [ "$CONTRACT" = "failure" ]; then result="FAILED (contract)"
          elif [ "$ADVERSARIAL" = "failure" ]; then result="FAILED (adversarial)"
          elif [ "$WEB" = "failure" ]; then result="FAILED (web not reachable)"
          elif [ "$E2E" = "failure" ]; then result="FAILED (e2e)"
          elif [ "$WEB_E2E" = "failure" ]; then result="FAILED (web e2e)"
          elif [ "$FILES" = "failure" ]; then result="FAILED (file flows)"
          elif [ "$DCR_FLOOD" = "failure" ]; then result="FAILED (adversarial DCR flood, case A8)"
          elif [ "$LONG" = "failure" ]; then result="FAILED (expiry flows)"
          else result="FAILED (setup, before the suites ran)"
          fi
          printf '\n**Verification:** %s · commit %s · run %s\n' "$result" "\`${HEAD_SHA:0:7}\`" "$RUN_URL" > "$RUNNER_TEMP/verification.md"
          cat "$RUNNER_TEMP/verification.md"

      - name: Append the Verification line to the preview comment
        if: always()
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: a2h-preview
          append: true
          path: ${{ runner.temp }}/verification.md

  # The PR was found not open (or its state unreadable) by the deploy job: run the same idempotent
  # sequence as teardown.yml (sst remove, then pr-schema.sh drop, then the PR
  # comment), in the same concurrency group.
  # require-closed: the PR may be reopened, and redeployed by the reopen's
  # run, between the deploy job above and this job taking the group. The
  # teardown re-reads the state first and skips (comment untouched) if open.
  teardown:
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.outputs.closed == 'true' }}
    uses: ./.github/workflows/preview-teardown.yml
    with:
      require-closed: true
    permissions:
      id-token: write
      contents: read
      pull-requests: write

  skipped:
    name: previews not enabled
    if: >-
      vars.A2H_DEPLOY_ENABLED != 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Comment on PR
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: a2h-preview
          message: |
            ## Preview not deployed

            Preview environments are not enabled yet for this repository
            (repository variable `A2H_DEPLOY_ENABLED` is not `true`).

            The owner enables them by completing `docs/runbooks/aws-bootstrap.md`
            (AWS account, OIDC roles `gha-a2h-dev` and `gha-a2h-preview`, first `dev`
            deploy) and setting the repository variables `AWS_DEV_ROLE_ARN`,
            `AWS_PREVIEW_ROLE_ARN` and `A2H_DEPLOY_ENABLED=true`.
            This comment is replaced by the preview URLs on the next push once enabled.
