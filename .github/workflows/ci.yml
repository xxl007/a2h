# CI gate: lint, typecheck, test, and the CI's own checks.
# Runs on every pull request and on pushes to main, and is reused by
# preview.yml and deploy.yml through workflow_call so the gate is defined once.
# Spec: openspec/.../preview-environments/spec.md, "CI gates every PR".
#
# Actions are pinned by commit SHA (tag in the comment), like in the deploy
# workflows (contract amendment 1). Dependabot updates the SHA and the comment.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

# github.workflow is the caller's name when reused, so CI, Preview and Deploy
# never share a group. Superseded PR runs are cancelled; runs on main are not
# (a cancelled check on main would silently skip that commit's dev deploy).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install shellcheck
        run: command -v shellcheck >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck; }

      # A fixed release, verified against its published SHA-256, never `latest`.
      # actionlint runs shellcheck on every `run:` block.
      - name: Lint workflows (actionlint)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color -shellcheck shellcheck

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        # version omitted on purpose: read from "packageManager" in package.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The preview/teardown script is tested here because a broken script only
      # shows up after a deploy otherwise: against a stubbed aws CLI (statements,
      # order, secret, masking), against a real Postgres 17 in Docker (isolation
      # of two PRs, drop), and against the names in infra/config.ts. The
      # workflows' structure and infra/bootstrap/*.json are checked by parsing
      # them (tests/ci/*.test.mjs; yaml is a devDependency of @a2h/tests).
      - name: Check CI scripts
        env:
          PR_SCHEMA_PG_REQUIRED: "1"
        run: |
          shellcheck -x .github/scripts/*.sh tests/ci/*.sh tests/ci/lib/fixtures.sh tests/ci/lib/bin/aws
          bash tests/ci/pr-schema.test.sh
          bash tests/ci/infra-consistency.test.sh
          bash tests/ci/pr-schema.pg.test.sh
          node --test tests/ci/*.test.mjs
